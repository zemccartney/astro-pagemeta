# CI: static checks + the Astro × Node support matrix (ROADMAP M2).
#
# Matrix policy (maintenance/astro-node-support.md): newest Astro major on
# the newest Node LTS is the default leg; one leg per additional supported
# Astro major; plus the published Node floor on the newest Astro. Astro
# switching uses scripts/use-astro.ts — the same script works locally.
#
# Install vs. run Node: every leg INSTALLS on the dev-toolchain Node (24 —
# workspace `engines` + engine-strict; several dev deps such as eslint 10
# and tsdown floor above 22.12), then the floor leg SWITCHES Node before
# running the suite. The published floor (publishConfig.engines) is a
# runtime claim about the integration, not about the dev toolchain.
#
# All actions are pinned to commit SHAs (supply-chain baseline,
# planning/plan/deps-security.md); the version comment must match the SHA
# when either is updated.
name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        name: Static checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "24"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod
            # typecheck builds the package (tsdown && tsc -b); lint's typed
            # rules resolve @grepco/astro-pagemeta/* through package exports
            # to dist/*.d.mts, so it must run after the build exists
            - run: pnpm typecheck
            - run: pnpm lint
            - run: pnpm fmt
            - run: pnpm knip
            - run: pnpm --filter @grepco/astro-pagemeta check:engines

    test:
        name: Test (astro ${{ matrix.astro }} · node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Default: newest supported Astro major × newest Node LTS
                    - astro: "7"
                      node: "24"
                    # Previous supported Astro major (security-fixes-only upstream)
                    - astro: "6"
                      node: "24"
                    # Published Node floor (publishConfig.engines) × newest Astro
                    - astro: "7"
                      node: "22.12"
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
            # Install on the dev-toolchain Node regardless of the leg (see header)
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "24"
                  cache: pnpm
            - if: matrix.astro == '7'
              run: pnpm install --frozen-lockfile
            # use-astro.ts rewrites the catalog + playground adapter range and
            # runs pnpm install --no-frozen-lockfile itself
            - if: matrix.astro != '7'
              run: node scripts/use-astro.ts ${{ matrix.astro }}
            # Build on the toolchain Node (this is what `pretest` does)
            - run: pnpm --filter @grepco/astro-pagemeta build
            # Floor leg: switch to the published Node floor for the run only
            - if: matrix.node != '24'
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: ${{ matrix.node }}
            - run: node --version
            # Invoke vitest's bin directly: pnpm enforces workspace `engines`
            # on `pnpm run` as well as install, so `pnpm test` cannot run on
            # the floor Node. Same command as `pnpm test` minus pretest.
            - run: ./node_modules/.bin/vitest --run
              working-directory: packages/ephemeris
