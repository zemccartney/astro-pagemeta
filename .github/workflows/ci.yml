# CI: static checks + the Astro × Node support matrix (ROADMAP M2).
#
# Matrix policy (maintenance/astro-node-support.md): newest Astro major on
# the newest Node LTS is the default leg; one leg per additional supported
# Astro major; plus the published Node floor on the newest Astro. Astro
# switching uses scripts/use-astro.ts — the same script works locally.
#
# All actions are pinned to commit SHAs (supply-chain baseline,
# planning/plan/deps-security.md); the version comment must match the SHA
# when either is updated.
name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        name: Static checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: "24"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm audit --prod
            - run: pnpm lint
            - run: pnpm fmt
            - run: pnpm knip
            - run: pnpm typecheck

    test:
        name: Test (astro ${{ matrix.astro }} · node ${{ matrix.node }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Default: newest supported Astro major × newest Node LTS
                    - astro: "7"
                      node: "24"
                    # Previous supported Astro major (security-fixes-only upstream)
                    - astro: "6"
                      node: "24"
                    # Published Node floor (publishConfig.engines) × newest Astro
                    - astro: "7"
                      node: "22.12"
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - if: matrix.astro == '7'
              run: pnpm install --frozen-lockfile
            # use-astro.ts rewrites the catalog + playground adapter range and
            # runs pnpm install --no-frozen-lockfile itself
            - if: matrix.astro != '7'
              run: node scripts/use-astro.ts ${{ matrix.astro }}
            - run: pnpm --filter @grepco/astro-pagemeta test
