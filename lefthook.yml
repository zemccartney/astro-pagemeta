glob_matcher: doublestar

pre-commit:
    parallel: true
    commands:
        lint:
            glob: "**/*.{ts,astro,json}"
            run: pnpm lint:fix {staged_files}
            stage_fixed: true
        fmt:
            glob: "**/*.{ts,astro,json,md,yml,yaml}"
            run: pnpm exec prettier --write {staged_files}
            stage_fixed: true
        typecheck:
            glob: "**/*.{ts,astro}"
            run: pnpm typecheck
