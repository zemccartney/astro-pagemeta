packages:
    - packages/*
    - playground

blockExoticSubdeps: true

catalog:
    "@types/node": ^24.13.4
    astro: ^7.3.2
    tsdown: ^0.22.14
    typescript: ^6.0.3

disallowWorkspaceCycles: true

failIfNoMatch: true

ignoreWorkspaceRootCheck: true

minimumReleaseAge: 10080

onlyBuiltDependencies:
    - esbuild
    - lefthook
    - sharp

trustPolicy: no-downgrade

trustPolicyExclude:
    - vite@6.4.1
    - chokidar@4.0.3
